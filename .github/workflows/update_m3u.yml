name: Auto Update Cakhia M3U

on:
  schedule:
    - cron: '*/30 * * * *' # Chạy định kỳ mỗi 30 phút
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script to update m3u
        run: python update_playlist.py

      - name: Commit and push if playlist changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update M3U with full team/blv info [skip ci]" && git push)
          
